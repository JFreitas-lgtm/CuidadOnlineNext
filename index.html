<!doctype html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Aprenda a reconhecer golpes digitais e navegue com mais segurança.">
  <meta name="theme-color" content="#1554ED">
  <title>CuidadOnline · Educação e segurança digital</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/app.js"></script>
</head>

<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
  <noscript>Ative o JavaScript no navegador para explorar as leituras e o simulador.</noscript>
  <div id="app"></div>
  <template id="auth-template">
    <main class="auth-page" id="main-content" tabindex="-1">
      <aside class="story">
        <div data-brand="light"></div>
        <div class="story-body">
          <h2 class="story-title">A internet pode ser um lugar mais seguro.</h2>
          <p class="story-description">Aprenda a reconhecer golpes e cuide do que é importante para você. Um passo de
            cada vez.</p>
          <div class="art" data-shield></div>
        </div>
      </aside>
      <section class="auth-main">
        <form id="auth-form" class="auth-form" novalidate>
          <h1 class="auth-title" id="auth-title" tabindex="-1"></h1>
          <p class="description" id="auth-description"></p>
          <p class="auth-error" id="auth-error" role="alert" hidden></p>
          <div id="auth-fields"></div>
          <button class="button full" type="submit" id="submit-auth"></button>
          <button class="button secondary full auth-guest" type="button" data-action="guest">Continuar como visitante</button>
          <div class="switch-row">
            <p class="small" id="switch-description"></p><button class="link" type="button" data-action="switch-auth"
              id="switch-auth"></button>
          </div>
        </form>
      </section>
    </main>
  </template>
  <template id="dashboard-template">
    <div class="app-layout">
      <aside class="sidebar">
        <div data-brand></div>
        <p class="tiny sidebar-caption">SEU ESPAÇO</p>
        <nav class="desktop-nav" aria-label="Navegação principal" data-nav></nav>
        <div class="sidebar-bottom">
          <div class="sidebar-tip"><span data-icon="heart"></span>
            <p class="label">Na dúvida, pare e confira.</p>
            <p class="small">Você não precisa decidir com pressa.</p>
          </div><button class="link" data-action="exit">Sair</button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <a class="help-shortcut" href="#ajuda">Preciso de ajuda</a>
          <div class="mobile-brand" data-brand></div>
          <div class="row"><button class="theme-toggle" data-action="theme"></button><span
              class="badge tiny">Conta</span><span class="label desktop-only" id="user-name"></span><span
              class="avatar" id="user-avatar"></span></div>
        </header>
        <nav class="mobile-nav" aria-label="Navegação principal" data-nav></nav>
        <main class="dashboard" id="main-content" tabindex="-1">
          <div class="content">
            <p class="kicker">UM PASSO DE CADA VEZ</p>
            <h1 class="page-title" id="page-title" tabindex="-1"></h1>
            <p class="description" id="page-description"></p>
            <section id="home-overview">
              <div class="hero">
                <div class="hero-copy"><span class="hero-badge">SEU CONHECIMENTO É SUA PROTEÇÃO</span>
                  <h2 class="hero-title">Mais confiança em cada clique.</h2>
                  <p class="hero-description">Reconheça os sinais de um golpe antes de compartilhar seus dados ou enviar
                    dinheiro.</p><button class="button secondary hero-button" data-action="start-learning">Começar a
                    aprender →</button>
                </div>
                <div class="hero-art" data-shield></div>
              </div>
              <div id="resume-reading"></div>
              <div class="stats" aria-label="Seu progresso">
                <div class="stat">
                  <p class="stat-number"><span id="completed-count">0</span><span class="stat-total"> / <span id="completed-total">0</span></span></p>
                  <p class="small">temas concluídos</p>
                </div>
                <div class="stat">
                  <p class="stat-number"><span id="completed-percent">0</span><span class="stat-total">%</span></p>
                  <p class="small">da sua jornada</p>
                </div>
                <div class="stat journey">
                  <p class="label">Cada passo conta</p>
                  <p class="small">Seu progresso sincronizado</p><progress id="reading-progress" max="1" value="0"
                    aria-label="Temas concluídos"></progress>
                </div>
              </div>
            </section>
            <div class="lower" id="learning-area">
              <section class="lessons" id="lessons-panel"></section>
              <section class="quiz-card" id="quiz-panel" aria-label="Simulador de golpes"></section>
            </div>
            <section id="extra-panel" class="page-stack" hidden></section>
            <p id="storage-status" class="small storage-status" role="status"></p>
            <footer class="bottom-note">
              <p class="small">♡ Aprender a se proteger também é cuidar de quem você ama.</p>
              <p class="tiny">CuidadOnline · Educação e segurança digital</p>
            </footer>
          </div>
        </main>
      </div>
    </div>
  </template>
  <dialog id="clear-dialog" aria-labelledby="clear-title" aria-describedby="clear-description">
    <h2 id="clear-title" class="section-title">Apagar o progresso da sua conta?</h2>
    <p id="clear-description" class="description">As leituras, os favoritos, os resultados e o histórico serão removidos
      da sua conta. Sua conta continuará ativa. Essa ação não pode ser desfeita.</p>
    <form method="dialog" class="dialog-actions"><button class="button secondary" value="cancel" autofocus>Manter
        progresso</button><button class="button" value="clear">Apagar progresso</button></form>
  </dialog>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <h2 class="section-title" id="share-title">Compartilhar cuidado</h2>
    <p class="description">Copie as dicas e cole na conversa que você escolher.</p>
    <label class="label" for="share-text">Texto das dicas</label>
    <textarea id="share-text" class="search-input" rows="9" readonly></textarea>
    <p id="share-status" class="small" role="status"></p>
    <div class="dialog-actions"><button class="button" id="copy-tips">Copiar dicas</button>
      <form method="dialog"><button class="button secondary">Fechar</button></form>
    </div>
  </dialog>
</body>

</html>
